<!doctype html><html><head><meta charset="utf-8"><style>

*{margin:0;padding:0;box-sizing:border-box}

  text-shadow:-2px -2px 0 #1c1c14,2px -2px 0 #1c1c14,-2px 2px 0 #1c1c14,2px 2px 0 #1c1c14,0 2px 0 #1c1c14,2px 0 0 #1c1c14,-2px 0 0 #1c1c14,0 -2px 0 #1c1c14}
</style></head><body>

<div class="g" id="g1"><div class="scrim" style="background:radial-gradient(ellipse 95% 40% at 50% 48%,rgba(4,10,22,.7),rgba(4,10,22,0) 100%)"></div>
  <div class="c sh" style="top:790px"><div class="serif" id="g1t" style="font-weight:500;font-size:126px;line-height:1;letter-spacing:.14em;padding-left:.14em"></div></div>
  <div class="c" style="top:950px"><div class="line" id="g1l" style="width:0"></div></div>
  <div class="c sh" style="top:990px"><div class="serif" id="g1s" style="font-style:italic;font-weight:400;font-size:52px;line-height:1.25;padding:0 110px">Uma exposição de arte,<br>expressão e novos olhares.</div></div>
</div>
<div class="g" id="g2"><div class="scrim" style="background:radial-gradient(ellipse 95% 30% at 50% 52%,rgba(4,10,22,.74),rgba(4,10,22,0))"></div>
  <div class="c sh" style="top:900px"><div class="eyebrow" id="g2a" style="font-weight:600;font-size:34px">Instituto BZN</div></div>
  <div class="c" style="top:968px"><div class="line" id="g2l" style="width:0;opacity:.7"></div></div>
  <div class="c sh" style="top:1000px"><div class="serif" id="g2b" style="font-style:italic;font-weight:500;font-size:60px">Exposição de Isabel Ferreira</div></div>
</div>
<div class="g" id="g3"><div class="scrim" style="background:linear-gradient(90deg,rgba(4,10,22,.55),rgba(4,10,22,0) 70%);top:1030px;bottom:auto;height:200px"></div>
  <div style="position:absolute;left:90px;top:1060px" class="sh">
    <div style="display:flex;align-items:center;gap:22px"><div class="line" id="g3l" style="width:0;margin:0"></div><div class="eyebrow" id="g3a" style="font-size:24px">Artista</div></div>
    <div class="serif" id="g3b" style="font-style:italic;font-weight:500;font-size:78px;margin-top:10px">Isabel Ferreira</div>
  </div>
</div>
<div class="g serie" id="g4" data-nome="Anônimos"></div>
<div class="g serie" id="g5" data-nome="Palmas"></div>
<div class="g serie" id="g6" data-nome="Enchentes"></div>
<div class="g serie" id="g7" data-nome="Telas Azuis"></div>
<div class="g" id="g8" style="opacity:1"><div class="leg" id="leg"></div></div>
<div class="g" id="g9"><div class="scrim" style="background:radial-gradient(ellipse 90% 30% at 50% 45%,rgba(3,12,30,.6),rgba(3,12,30,0))"></div>
  <div class="c" style="top:790px"><div class="serif" id="g9t" style="font-weight:600;font-size:122px;letter-spacing:.12em;padding-left:.12em;text-shadow:0 0 50px rgba(120,190,255,.55),0 4px 30px rgba(0,0,0,.4)"></div></div>
</div>
<div class="g" id="g10"><div class="scrim" style="background:radial-gradient(ellipse 95% 45% at 50% 50%,rgba(4,10,22,.6),rgba(4,10,22,0))"></div>
  <div class="c sh" style="top:680px"><div class="serif" id="g10t" style="font-weight:500;font-size:122px;letter-spacing:.14em;padding-left:.14em"></div></div>
  <div class="c" style="top:850px"><div class="line" id="g10l" style="width:0"></div></div>
  <div class="c sh serif" style="top:890px;font-style:italic;font-weight:400;font-size:58px;line-height:1.45">
    <div id="g10a">Arte que expressa.</div><div id="g10b">Arte que transforma.</div><div id="g10c">Arte que renova a esperança.</div></div>
</div>
<div class="g" id="g11"><div class="scrim" style="background:radial-gradient(ellipse 85% 28% at 50% 50%,rgba(4,10,22,.6),rgba(4,10,22,0))"></div>
  <div class="c sh" style="top:860px"><div class="serif" id="g11a" style="font-weight:500;font-size:80px;letter-spacing:.1em;padding-left:.1em">ISABEL FERREIRA</div></div>
  <div class="c" style="top:990px"><div class="line" id="g11l" style="width:0;opacity:.7"></div></div>
  <div class="c sh" style="top:1020px"><div class="serif" id="g11b" style="font-style:italic;font-weight:400;font-size:56px">Exposição no Instituto BZN</div></div>
</div>
<div class="g" id="g12" style="background:#08121f"><img id="logo" src="__LOGO__" style="position:absolute;left:50%;top:50%;width:420px;transform:translate(-50%,-50%)">
  <div class="c serif" id="g12t" style="top:1210px;font-weight:500;font-size:46px;letter-spacing:.32em;padding-left:.32em">RECOMEÇO</div></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
function letters(el,txt){el.innerHTML=[...txt].map(c=>c===' '?'<span class="L">&nbsp;</span>':'<span class="L">'+c+'</span>').join('')}
document.querySelectorAll('.serie').forEach(g=>{
  g.innerHTML='<div class="scrim" style="background:linear-gradient(180deg,rgba(4,10,22,.66) 0%,rgba(4,10,22,.35) 55%,rgba(4,10,22,0) 100%);height:700px;bottom:auto"></div>'+
  '<div class="c sh" style="top:300px"><div class="eyebrow ey">Série</div></div>'+
  '<div class="c" style="top:352px"><div class="line ln" style="width:0;opacity:.8"></div></div>'+
  '<div class="c sh" style="top:376px"><div class="serif nm" style="font-weight:600;font-size:118px;line-height:1;text-transform:uppercase;letter-spacing:.07em;padding-left:.07em"></div></div>';
  letters(g.querySelector('.nm'),g.dataset.nome);
});
letters($('g1t'),'RECOMEÇO'); letters($('g9t'),'ESPERANÇA'); letters($('g10t'),'RECOMEÇO');
function stagger(el,t,t0,step,dur,blur,dy,spread){
  const n=el.children.length;
  [...el.children].forEach((s,i)=>{const p=ease((t-t0-i*step)/dur);
    s.style.opacity=p; s.style.filter='blur('+((1-p)*blur).toFixed(2)+'px)';
    s.style.transform='translate('+((1-p)*spread*(i-(n-1)/2)).toFixed(1)+'px,'+((1-p)*dy).toFixed(1)+'px)';});
}
function fadeUp(el,t,t0,dur,dy){if(dy===undefined)dy=26;const p=ease((t-t0)/dur);el.style.opacity=p;el.style.transform='translateY('+((1-p)*dy).toFixed(1)+'px)';el.style.filter='blur('+((1-p)*6).toFixed(2)+'px)'}
function group(g,t,t0,t1,fo){const on=t>=t0-0.01&&t<=t1+0.01; g.style.opacity=on?clamp(Math.min((t-t0)/0.35+1e-6,(t1-t)/fo)):0; return on}
const LEG=__LEGENDAS__;
window.render=function(t){
  if(group($('g1'),t,5.4,10.6,0.7)){stagger($('g1t'),t,5.5,0.11,1.3,18,10,22); $('g1l').style.width=(ease((t-6.6)/1.1)*260)+'px'; fadeUp($('g1s'),t,7.3,1.1)}
  if(group($('g2'),t,10.7,13.55,0.5)){fadeUp($('g2a'),t,10.8,0.9); $('g2l').style.width=(ease((t-11.1)/0.9)*140)+'px'; fadeUp($('g2b'),t,11.3,1.0)}
  if(group($('g3'),t,15.0,19.6,0.6)){$('g3l').style.width=(ease((t-15.1)/0.7)*70)+'px'; fadeUp($('g3a'),t,15.3,0.8,0); fadeUp($('g3b'),t,15.4,1.0,18)}
  [['g4',28.25,33.0],['g5',46.2,50.9],['g6',63.85,68.6],['g7',84.2,89.0]].forEach(function(x){const g=$(x[0]),a=x[1],b=x[2];
    if(group(g,t,a,b,0.6)){g.querySelector('.ln').style.width=(ease((t-a-0.05)/0.8)*110)+'px'; fadeUp(g.querySelector('.ey'),t,a+0.15,0.8,12); stagger(g.querySelector('.nm'),t,a+0.35,0.06,0.9,10,16,10)}});
  let txt=''; for(const r of LEG){ if(t>=r[0]&&t<r[1]){txt=r[2];break} } $('leg').textContent=txt;
  if(group($('g9'),t,93.55,96.1,0.7)){stagger($('g9t'),t,93.6,0.09,1.2,20,0,0); $('g9t').style.transform='scale('+(1+0.04*clamp((t-93.6)/2.5))+')'}
  if(group($('g10'),t,140.9,147.3,0.7)){stagger($('g10t'),t,141.0,0.1,1.2,16,10,18); $('g10l').style.width=(ease((t-142.0)/1.0)*220)+'px';
     fadeUp($('g10a'),t,142.4,1.0); fadeUp($('g10b'),t,143.6,1.0); fadeUp($('g10c'),t,144.8,1.1)}
  if(group($('g11'),t,147.7,151.1,0.5)){fadeUp($('g11a'),t,147.8,1.0); $('g11l').style.width=(ease((t-148.3)/0.9)*160)+'px'; fadeUp($('g11b'),t,148.6,1.0)}
  if(group($('g12'),t,151.25,154.25,0.01)){$('g12').style.opacity=clamp((t-151.25)/0.6)*clamp((154.25-t)/0.5); fadeUp($('logo'),t,151.6,1.2,0);
     $('logo').style.transform='translate(-50%,-50%) scale('+(0.96+0.04*ease((t-151.6)/2.4))+')'; fadeUp($('g12t'),t,152.4,1.0,10)}
};
</script></body></html>
