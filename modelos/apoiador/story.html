<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"InterD";font-weight:900;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf")}
@font-face{font-family:"InterD";font-weight:500;font-style:italic;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-MediumItalic.otf")}
@font-face{font-family:"Inter";font-weight:400;src:url("file:///usr/share/fonts/opentype/inter/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:600;src:url("file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("file:///usr/share/fonts/opentype/inter/Inter-Bold.otf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px}
.s{position:relative;width:1080px;height:1920px;background:url("../../marca/fundo-story.png") center/cover;font-family:Inter;color:#11329b;overflow:hidden}
.topo{position:absolute;top:440px;left:80px;right:80px;text-align:center}
.tag{display:inline-block;font-weight:700;font-size:30px;letter-spacing:.14em;text-transform:uppercase;border:3px solid #11329b;border-radius:999px;padding:12px 30px 10px}
h1{font-family:InterD;font-weight:900;text-transform:uppercase;font-size:150px;line-height:.88;letter-spacing:-.03em;margin-top:44px}
h1 span{display:block;color:#fff;background:#11329b;padding:6px 26px 14px;margin:12px auto 0;width:max-content;border-radius:18px;transform:rotate(-2deg)}
.sub{font-size:44px;line-height:1.3;margin-top:46px;font-weight:600}
.sub b{font-weight:800}
.base{position:absolute;left:80px;right:80px;top:1200px;text-align:center;color:#fff}
.base p{font-size:46px;line-height:1.3;font-weight:400}
.base p b{font-weight:700}
.cta{margin-top:40px;font-family:InterD;font-weight:900;font-size:62px;line-height:1.05;text-transform:uppercase;letter-spacing:-.01em}
.seta{margin:26px auto 0;width:70px;height:70px;animation:none}
.seta path{stroke:#fff;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><div class="s">
  <div class="topo">
    <div class="tag">Apoiadores do Instituto</div>
    <h1>Seja como<span>a Valéria</span></h1>
    <p class="sub">Ela apoia o Instituto Brasa Zona Norte<br>de longe e ajuda a <b>transformar vidas</b><br>aqui perto.</p>
  </div>
  <div class="base">
    <p>Você também pode fazer parte,<br><b>de onde estiver.</b></p>
    <div class="cta">Toque no link e<br>seja um apoiador</div>
    <svg class="seta" viewBox="0 0 70 70"><path d="M35 8 V58 M14 38 L35 59 L56 38"/></svg>
  </div>
</div></body></html>
