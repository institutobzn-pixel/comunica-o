<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"InterD";font-weight:900;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf")}
@font-face{font-family:"InterD";font-weight:500;font-style:italic;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-MediumItalic.otf")}
@font-face{font-family:"Inter";font-weight:400;src:url("file:///usr/share/fonts/opentype/inter/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("file:///usr/share/fonts/opentype/inter/Inter-Bold.otf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;color:#fff;font-family:Inter}
.l{position:absolute;inset:0;display:none}
/* BASE: sombreamento inferior + selo DEPOIMENTO + nome */
.base{position:absolute;inset:auto 0 0 0;height:1050px;background:linear-gradient(0deg,rgba(8,20,34,.97) 0%,rgba(8,20,34,.9) 45%,rgba(8,20,34,.55) 75%,rgba(8,20,34,0) 100%)}
.topo{position:absolute;inset:0 0 auto 0;height:360px;background:linear-gradient(180deg,rgba(10,24,40,.55),rgba(10,24,40,0))}
.selo{position:absolute;left:70px;top:250px;display:flex;align-items:center;gap:14px}
.selo span{font-family:InterD;font-weight:900;font-size:40px;letter-spacing:.06em;background:#fff;color:#14264a;padding:10px 20px 8px;border-radius:8px}
.nome{position:absolute;left:70px;right:70px;bottom:370px;border-top:2px solid rgba(255,255,255,.45);padding-top:26px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.nome .q{font-size:34px;line-height:1.25}.nome .q b{font-size:44px;display:block;font-family:InterD;font-weight:900;letter-spacing:-.01em}
.nome img{width:150px}
/* LEGENDA */
.leg{position:absolute;left:70px;right:70px;bottom:540px;font-family:InterD;font-weight:900;font-size:96px;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.leg i{font-style:normal;color:rgba(255,255,255,.62)}
.leg em{font-style:normal;color:#fff;background:#2f5fd0;box-shadow:0 0 0 8px #2f5fd0;border-radius:6px}
/* FINAL */
.fim{background:#0c1a2b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:56px;text-align:center}
.fim img{width:440px}
.fim p{font-family:InterD;font-weight:900;font-size:84px;line-height:1;text-transform:uppercase;letter-spacing:-.02em}
.fim small{display:block;font-family:Inter;font-weight:400;font-size:36px;text-transform:none;letter-spacing:0;opacity:.8;margin-top:22px}
</style></head><body>
<div class="l" id="base"><div class="topo"></div><div class="base"></div>
  <div class="selo"><span>DEPOIMENTO</span></div>
  <div class="nome"><div class="q"><b>Joelma</b>Aluna do Instituto Brasa Zona Norte</div><img src="../../marca/logo-branca.png"></div></div>
<div class="l" id="leg"><div class="leg" id="legtxt"></div></div>
<div class="l fim" id="fim"><img src="../../marca/logo-branca.png"><p>Quem não conhece,<br>vem pra cá!<small>Informações no WhatsApp (11) 00000-0000</small></p></div>
</body></html>
